# Test configuration for STHS34PF80 component
# This file is used to verify the component compiles correctly

esphome:
  name: sths34pf80-test
  friendly_name: STHS34PF80 Test

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

i2c:
  sda: GPIO21
  scl: GPIO22

sths34pf80:
  - id: test_sensor
    update_interval: 1s

sensor:
  - platform: sths34pf80
    sths34pf80_id: test_sensor
    ambient_temperature:
      name: "Test Ambient Temperature"

binary_sensor:
  - platform: sths34pf80
    sths34pf80_id: test_sensor
    presence_flag:
      name: "Test Presence"
    motion_flag:
      name: "Test Motion"

