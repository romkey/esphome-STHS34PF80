# Deep Sleep STHS34PF80 Example Configuration
# This example shows how to use the sensor with deep sleep for battery-powered applications
# The sensor will generate an interrupt on motion/presence detection to wake the ESP

esphome:
  name: sths34pf80-deepsleep
  friendly_name: STHS34PF80 Deep Sleep Example
  on_boot:
    priority: -100
    then:
      # Log boot reason
      - logger.log:
          format: "Device booted, run duration will be %d seconds"
          args: ['id(run_duration)']
      # Start deep sleep timer
      - delay: !lambda "return id(run_duration) * 1000;"
      - logger.log: "Entering deep sleep..."
      - deep_sleep.enter: deep_sleep_control

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Fast connect for battery saving
  fast_connect: true
  
  # Enable fallback hotspot
  ap:
    ssid: "STHS34PF80 DeepSleep"
    password: !secret fallback_password

captive_portal:

# I2C Configuration
i2c:
  sda: GPIO21
  scl: GPIO22
  frequency: 400kHz

# External Components
external_components:
  - source: github://romkey/esphome-STHS34PF80
    components: [ sths34pf80 ]

# Deep Sleep Configuration
# The ESP will wake up on:
# 1. Interrupt from STHS34PF80 (motion/presence detected)
# 2. After sleep duration (fallback)
deep_sleep:
  id: deep_sleep_control
  run_duration: 10s  # How long to stay awake after waking
  sleep_duration: 60min  # Fallback sleep time if no interrupt
  wakeup_pin: GPIO4  # Connected to sensor INT pin
  wakeup_pin_mode: IGNORE  # Wake on any edge (sensor configured for interrupt)

# Globals
globals:
  - id: run_duration
    type: int
    restore_value: no
    initial_value: '10'  # Seconds to run after wake

  - id: boot_count
    type: int
    restore_value: yes
    initial_value: '0'

# STHS34PF80 Component (top-level configuration)
# Configured to generate interrupts on presence and motion detection
sths34pf80:
  - id: ir_sensor
    address: 0x5A
    update_interval: 1s
    
    # Hardware configuration
    output_data_rate: 2HZ  # 2HZ for good responsiveness
    
    # Low-pass filter settings (tune for your use case)
    motion_lpf: ODR_DIV_20
    motion_presence_lpf: ODR_DIV_20
    presence_lpf: ODR_DIV_50
    temperature_lpf: ODR_DIV_100
    
    # Averaging
    amb_temp_avg: 8
    obj_temp_avg: 32
    
    # Interrupt configuration - CRITICAL for deep sleep wake-up
    enable_presence_interrupt: true   # Enable interrupt on presence detection
    enable_motion_interrupt: true     # Enable interrupt on motion detection
    int_active_low: false             # Active high interrupt
    int_open_drain: false             # Push-pull output
    int_latched: false                # Pulsed interrupt mode

# Sensors - Read on wake
sensor:
  - platform: sths34pf80
    sths34pf80_id: ir_sensor
    ambient_temperature:
      name: "Ambient Temperature"
      id: amb_temp
    presence:
      name: "Presence Value"
      id: presence_val
    motion:
      name: "Motion Value"
      id: motion_val

  # WiFi signal strength
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 5s

  # Boot counter
  - platform: template
    name: "Boot Count"
    id: boot_count_sensor
    accuracy_decimals: 0
    lambda: |-
      id(boot_count) += 1;
      return id(boot_count);
    update_interval: never

# Binary Sensors
binary_sensor:
  - platform: sths34pf80
    sths34pf80_id: ir_sensor
    presence_flag:
      name: "Presence Detected"
      id: presence
      on_press:
        then:
          - logger.log: "PRESENCE DETECTED - This triggered the wake-up!"
          - homeassistant.event:
              event: esphome.presence_detected
              data:
                device: sths34pf80_deepsleep
                boot_count: !lambda 'return id(boot_count);'
          # Extend run time if presence detected
          - globals.set:
              id: run_duration
              value: '30'
    
    motion_flag:
      name: "Motion Detected"
      id: motion
      on_press:
        then:
          - logger.log: "MOTION DETECTED - This triggered the wake-up!"
          - homeassistant.event:
              event: esphome.motion_detected
              data:
                device: sths34pf80_deepsleep
                boot_count: !lambda 'return id(boot_count);'
          # Extend run time if motion detected
          - globals.set:
              id: run_duration
              value: '30'

  # GPIO status to verify interrupt pin
  - platform: gpio
    pin: GPIO4
    name: "Interrupt Pin Status"
    id: int_pin
    internal: true

# Text Sensors
text_sensor:
  # Wakeup reason
  - platform: template
    name: "Wakeup Reason"
    id: wakeup_reason
    lambda: |-
      if (id(presence).state || id(motion).state) {
        return {"Sensor Interrupt"};
      } else {
        return {"Timer"};
      }
    update_interval: 5s

# Switches
switch:
  # Manual deep sleep trigger
  - platform: template
    name: "Enter Deep Sleep"
    id: sleep_now
    turn_on_action:
      - logger.log: "Manual deep sleep trigger"
      - deep_sleep.enter: deep_sleep_control

  # Prevent deep sleep (for debugging/testing)
  - platform: template
    name: "Prevent Deep Sleep"
    id: prevent_sleep
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - deep_sleep.prevent: deep_sleep_control
      - logger.log: "Deep sleep prevented"
    on_turn_off:
      - deep_sleep.allow: deep_sleep_control
      - logger.log: "Deep sleep allowed"

# Status LED (optional)
output:
  - platform: gpio
    pin: GPIO2
    id: status_led

light:
  - platform: binary
    name: "Status LED"
    output: status_led
    id: status_light

# Script to flash LED on wake
script:
  - id: flash_led
    then:
      - light.turn_on: status_light
      - delay: 100ms
      - light.turn_off: status_light
      - delay: 100ms
      - light.turn_on: status_light
      - delay: 100ms
      - light.turn_off: status_light

# Interval to flash LED while awake
interval:
  - interval: 2s
    then:
      - script.execute: flash_led
      - sensor.template.publish:
          id: boot_count_sensor
          state: !lambda 'return id(boot_count);'

