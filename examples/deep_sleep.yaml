# Example: battery-powered sensor that sleeps until the STHS34PF80 sees
# presence or motion. The sensor keeps running while the ESP32 sleeps and
# pulses its INT pin, which wakes the ESP32. ESP32 DevKit.
#
# Wiring: VDD -> 3.3V, GND -> GND, SDA -> GPIO21, SCL -> GPIO22,
# INT -> GPIO4 (RTC-capable, so it can wake the chip), optional LED +
# resistor -> GPIO13. None are strapping pins on the ESP32. Keep the sensor
# powered during deep sleep.

substitutions:
  name: sths34pf80-deep-sleep
  friendly_name: STHS34PF80 Deep Sleep

esp32:
  board: esp32dev
  framework:
    type: esp-idf

packages:
  base: !include common/base.yaml

external_components:
  - source: ../components
    components: [sths34pf80]

wifi:
  fast_connect: true

i2c:
  id: i2c0
  sda: GPIO21
  scl: GPIO22
  frequency: 400kHz

# Awake for run_duration after each wake-up, then sleep until the sensor
# interrupts or sleep_duration passes.
deep_sleep:
  id: deep_sleep_control
  run_duration: 10s
  sleep_duration: 60min
  wakeup_pin: GPIO4
  wakeup_pin_mode: IGNORE

globals:
  - id: boot_count
    type: int
    restore_value: true
    initial_value: "0"

sths34pf80:
  - id: ir_sensor
    update_interval: 1s
    output_data_rate: 2HZ
    motion_lpf: ODR_DIV_20
    presence_lpf: ODR_DIV_50
    # Required for wake-up: pulse INT, active high, push-pull.
    enable_presence_interrupt: true
    enable_motion_interrupt: true
    int_active_low: false
    int_open_drain: false
    int_latched: false

sensor:
  - platform: sths34pf80
    sths34pf80_id: ir_sensor
    ambient_temperature:
      name: "Ambient Temperature"

  - platform: template
    name: "Boot Count"
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic
    # Counted here rather than in on_boot, which would merge with the
    # i2c-scan package's on_boot.
    lambda: |-
      static bool counted = false;
      if (!counted) {
        id(boot_count) += 1;
        counted = true;
      }
      return id(boot_count);
    update_interval: 5s

binary_sensor:
  - platform: sths34pf80
    sths34pf80_id: ir_sensor
    presence_flag:
      name: "Presence"
      on_press:
        - homeassistant.event:
            event: esphome.presence_detected
            data:
              boot_count: !lambda "return id(boot_count);"
    motion_flag:
      name: "Motion"
      on_press:
        - homeassistant.event:
            event: esphome.motion_detected
            data:
              boot_count: !lambda "return id(boot_count);"

switch:
  # Stay awake, e.g. to flash OTA updates.
  - platform: template
    name: "Prevent Deep Sleep"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - deep_sleep.prevent: deep_sleep_control
    on_turn_off:
      - deep_sleep.allow: deep_sleep_control

output:
  - platform: gpio
    pin: GPIO13
    id: status_led_output

light:
  - platform: binary
    name: "Status LED"
    output: status_led_output
    entity_category: config
