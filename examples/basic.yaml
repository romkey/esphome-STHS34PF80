# Basic STHS34PF80 Example Configuration
# This example shows a minimal setup for the STHS34PF80 sensor

esphome:
  name: sths34pf80-basic
  friendly_name: STHS34PF80 Basic Example

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot
  ap:
    ssid: "STHS34PF80 Fallback"
    password: !secret fallback_password

captive_portal:

# I2C Configuration
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  id: bus_a

# External Components
external_components:
  - source: github://romkey/esphome-STHS34PF80
    components: [ sths34pf80 ]

# STHS34PF80 Component (top-level configuration)
sths34pf80:
  - id: ir_sensor
    address: 0x5A
    update_interval: 1s

# STHS34PF80 Sensors
sensor:
  - platform: sths34pf80
    sths34pf80_id: ir_sensor
    ambient_temperature:
      name: "Ambient Temperature"

# STHS34PF80 Binary Sensors
binary_sensor:
  - platform: sths34pf80
    sths34pf80_id: ir_sensor
    presence_flag:
      name: "Presence Detected"
    motion_flag:
      name: "Motion Detected"

