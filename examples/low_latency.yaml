# Example: fastest presence and motion reporting. Fast polling, a high
# output data rate, the shortest filters and minimal averaging. ESP32 DevKit.
#
# Wiring: VDD -> 3.3V, GND -> GND, SDA -> GPIO21, SCL -> GPIO22.

substitutions:
  name: sths34pf80-low-latency
  friendly_name: STHS34PF80 Low Latency
  sths34pf80_component_source: ../components
  sths34pf80_update_interval: 100ms
  sths34pf80_output_data_rate: 8HZ
  sths34pf80_motion_lpf: ODR_DIV_9
  sths34pf80_motion_presence_lpf: ODR_DIV_9
  sths34pf80_presence_lpf: ODR_DIV_20
  sths34pf80_temperature_lpf: ODR_DIV_50
  sths34pf80_amb_temp_avg: "1"
  sths34pf80_obj_temp_avg: "2"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

i2c:
  id: i2c0
  sda: GPIO21
  scl: GPIO22
  frequency: 400kHz

packages:
  base: !include common/base.yaml
  sths34pf80: !include ../packages/sths34pf80.yaml

wifi:
  fast_connect: true
