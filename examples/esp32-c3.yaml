# Example: one STHS34PF80 on an ESP32-C3 DevKitM-1 (RISC-V).
#
# Board and pin choices live here, never in packages/.
#
# Wiring: STHS34PF80 VDD -> 3.3V, GND -> GND, SDA -> GPIO4, SCL -> GPIO5.
# GPIO4 and GPIO5 are not strapping pins on this chip.

substitutions:
  name: sths34pf80-esp32-c3
  friendly_name: STHS34PF80 ESP32-C3
  # Use the component in this repo rather than the released one.
  sths34pf80_component_source: ../components

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

i2c:
  id: i2c0
  sda: GPIO4
  scl: GPIO5
  frequency: 400kHz

packages:
  base: !include common/base.yaml
  sths34pf80: !include ../packages/sths34pf80.yaml
