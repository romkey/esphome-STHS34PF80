# Home Automation STHS34PF80 Example Configuration
# This example shows how to use the STHS34PF80 for automated lighting and HVAC control

esphome:
  name: room-sensor
  friendly_name: Room Presence Sensor

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  ap:
    ssid: "Room Sensor Fallback"
    password: !secret fallback_password

captive_portal:

# I2C Configuration
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

# External Components
external_components:
  - source: github://romkey/esphome-STHS34PF80
    components: [ sths34pf80 ]

# STHS34PF80 Component (top-level configuration)
sths34pf80:
  - id: ir_sensor
    address: 0x5A
    update_interval: 500ms
    output_data_rate: 2HZ

# Globals for state management
globals:
  - id: room_occupied_state
    type: bool
    restore_value: no
    initial_value: 'false'

# Script for presence-based automation
script:
  - id: handle_presence
    then:
      - if:
          condition:
            binary_sensor.is_on: presence
          then:
            - logger.log: "Room is occupied - triggering automations"
            - globals.set:
                id: room_occupied_state
                value: 'true'
            # Turn on lights if it's dark
            - if:
                condition:
                  sensor.in_range:
                    id: room_light_level
                    below: 100
                then:
                  - switch.turn_on: room_light
            # Send event to Home Assistant
            - homeassistant.event:
                event: esphome.room_occupied
                data:
                  room: living_room
                  temperature: !lambda 'return id(room_temp).state;'
          else:
            - logger.log: "Room is vacant"
            - globals.set:
                id: room_occupied_state
                value: 'false'
            # Turn off lights after delay
            - delay: 5min
            - if:
                condition:
                  lambda: 'return !id(room_occupied_state);'
                then:
                  - switch.turn_off: room_light
            # Send event to Home Assistant
            - homeassistant.event:
                event: esphome.room_vacant
                data:
                  room: living_room

# Interval to check presence state
interval:
  - interval: 1s
    then:
      - script.execute: handle_presence

# Sensors
sensor:
  # STHS34PF80 sensors
  - platform: sths34pf80
    sths34pf80_id: ir_sensor
    ambient_temperature:
      name: "Room Temperature"
      id: room_temp

  # Example light sensor (you would need actual hardware)
  - platform: template
    name: "Room Light Level"
    id: room_light_level
    unit_of_measurement: "lx"
    lambda: 'return 50;'  # Replace with actual sensor

# STHS34PF80 Binary Sensors
binary_sensor:
  - platform: sths34pf80
    sths34pf80_id: ir_sensor
    presence_flag:
      name: "Room Presence"
      id: presence
    motion_flag:
      name: "Room Motion"
      id: motion

  # Template binary sensor for overall occupancy (with hysteresis)
  - platform: template
    name: "Room Occupied"
    id: room_occupied
    lambda: |-
      return id(presence).state || id(motion).state;
    filters:
      - delayed_off: 2min  # Keep occupied for 2 minutes after last detection
    on_press:
      then:
        - logger.log: "Room occupied (with hysteresis)"
        - homeassistant.event:
            event: esphome.room_state_change
            data:
              state: occupied
              room: living_room
    on_release:
      then:
        - logger.log: "Room vacant (with hysteresis)"
        - homeassistant.event:
            event: esphome.room_state_change
            data:
              state: vacant
              room: living_room

# Example switch for room light
switch:
  - platform: gpio
    pin: GPIO25
    name: "Room Light"
    id: room_light
    restore_mode: RESTORE_DEFAULT_OFF

# Text sensor for room state
text_sensor:
  - platform: template
    name: "Room State"
    id: room_state
    lambda: |-
      if (id(motion).state) {
        return {"Active Motion"};
      } else if (id(presence).state) {
        return {"Presence Detected"};
      } else {
        return {"Vacant"};
      }
    update_interval: 1s

