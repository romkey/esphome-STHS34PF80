# Example: switch a light from room occupancy and tell Home Assistant when
# the room changes state. ESP32 DevKit.
#
# Wiring: VDD -> 3.3V, GND -> GND, SDA -> GPIO21, SCL -> GPIO22,
# light relay -> GPIO25.

substitutions:
  name: sths34pf80-room
  friendly_name: Room Presence Sensor
  sths34pf80_component_source: ../components
  sths34pf80_update_interval: 500ms
  sths34pf80_output_data_rate: 2HZ
  sths34pf80_temperature_name: "Room Temperature"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

i2c:
  id: i2c0
  sda: GPIO21
  scl: GPIO22
  frequency: 400kHz

packages:
  base: !include common/base.yaml
  sths34pf80: !include ../packages/sths34pf80.yaml

switch:
  - platform: gpio
    pin: GPIO25
    name: "Room Light"
    id: room_light
    restore_mode: RESTORE_DEFAULT_OFF

binary_sensor:
  # Occupied while presence or motion is seen, and for 2 minutes afterwards.
  - platform: template
    name: "Room Occupied"
    id: room_occupied
    device_class: occupancy
    lambda: |-
      return id(sths34pf80_presence).state || id(sths34pf80_motion).state;
    filters:
      - delayed_off: 2min
    on_press:
      - switch.turn_on: room_light
      - homeassistant.event:
          event: esphome.room_state_change
          data:
            state: occupied
            temperature: !lambda "return id(sths34pf80_temperature).state;"
    on_release:
      - switch.turn_off: room_light
      - homeassistant.event:
          event: esphome.room_state_change
          data:
            state: vacant

text_sensor:
  - platform: template
    name: "Room State"
    lambda: |-
      if (id(sths34pf80_motion).state) {
        return {"Motion"};
      } else if (id(sths34pf80_presence).state) {
        return {"Presence"};
      }
      return {"Vacant"};
    update_interval: 1s
