# Example: two STHS34PF80s on one ESP32 DevKit, by including the package
# twice. The sensor's I2C address is fixed at 0x5A (datasheet DS13916
# section 5.1), so each sensor needs its own I2C bus.
#
# Wiring: living room sensor SDA -> GPIO21, SCL -> GPIO22;
# hallway sensor SDA -> GPIO25, SCL -> GPIO26; both VDD -> 3.3V, GND -> GND.
# Lights: living room relay -> GPIO32, hallway relay -> GPIO33.

substitutions:
  name: sths34pf80-multi
  friendly_name: STHS34PF80 Multi

esp32:
  board: esp32dev
  framework:
    type: esp-idf

i2c:
  - id: i2c0
    sda: GPIO21
    scl: GPIO22
    frequency: 400kHz
  - id: i2c1
    sda: GPIO25
    scl: GPIO26
    frequency: 400kHz

packages:
  base: !include common/base.yaml
  living_room: !include
    file: ../packages/sths34pf80.yaml
    vars:
      sths34pf80_component_source: ../components
      sths34pf80_id: living_room_sensor
      sths34pf80_i2c_id: i2c0
      sths34pf80_update_interval: 5s
      sths34pf80_temperature_name: "Living Room Temperature"
      sths34pf80_temperature_id: living_room_temperature
      sths34pf80_presence_name: "Living Room Presence"
      sths34pf80_presence_id: living_room_presence
      sths34pf80_motion_name: "Living Room Motion"
      sths34pf80_motion_id: living_room_motion
      sths34pf80_presence_value_name: "Living Room Presence Value"
      sths34pf80_presence_value_id: living_room_presence_value
      sths34pf80_motion_value_name: "Living Room Motion Value"
      sths34pf80_motion_value_id: living_room_motion_value
  hallway: !include
    file: ../packages/sths34pf80.yaml
    vars:
      sths34pf80_component_source: ../components
      sths34pf80_id: hallway_sensor
      sths34pf80_i2c_id: i2c1
      sths34pf80_update_interval: 500ms
      sths34pf80_output_data_rate: 4HZ
      sths34pf80_temperature_name: "Hallway Temperature"
      sths34pf80_temperature_id: hallway_temperature
      sths34pf80_presence_name: "Hallway Presence"
      sths34pf80_presence_id: hallway_presence
      sths34pf80_motion_name: "Hallway Motion"
      sths34pf80_motion_id: hallway_motion
      sths34pf80_presence_value_name: "Hallway Presence Value"
      sths34pf80_presence_value_id: hallway_presence_value
      sths34pf80_motion_value_name: "Hallway Motion Value"
      sths34pf80_motion_value_id: hallway_motion_value

output:
  - platform: gpio
    pin: GPIO32
    id: living_room_output
  - platform: gpio
    pin: GPIO33
    id: hallway_output

light:
  - platform: binary
    name: "Living Room Light"
    id: living_room_light
    output: living_room_output
  - platform: binary
    name: "Hallway Light"
    id: hallway_light
    output: hallway_output

binary_sensor:
  - platform: template
    name: "Living Room Occupied"
    device_class: occupancy
    lambda: |-
      return id(living_room_presence).state || id(living_room_motion).state;
    filters:
      - delayed_off: 5min
    on_press:
      - light.turn_on: living_room_light
    on_release:
      - light.turn_off: living_room_light

  - platform: template
    name: "Hallway Occupied"
    device_class: occupancy
    lambda: |-
      return id(hallway_motion).state;
    filters:
      - delayed_off: 30s
    on_press:
      - light.turn_on: hallway_light
    on_release:
      - light.turn_off: hallway_light

sensor:
  - platform: template
    name: "Average Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      if (id(living_room_temperature).has_state() && id(hallway_temperature).has_state()) {
        return (id(living_room_temperature).state + id(hallway_temperature).state) / 2.0;
      }
      return {};
    update_interval: 10s
