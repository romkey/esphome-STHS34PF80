# Multiple STHS34PF80 Devices Example
# This example demonstrates using multiple STHS34PF80 sensors on the same ESP
# Each device can have different configurations and update rates

esphome:
  name: sths34pf80-multi
  friendly_name: Multiple STHS34PF80 Sensors

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  ap:
    ssid: "STHS34PF80 Multi"
    password: !secret fallback_password

captive_portal:

# I2C Configuration
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 400kHz

# External Components
external_components:
  - source: github://romkey/esphome-STHS34PF80
    components: [ sths34pf80 ]

# STHS34PF80 Components (multiple instances using MULTI_CONF)
sths34pf80:
  # First sensor - Living room (0x5A)
  # Configured for temperature monitoring with slow updates
  - id: living_room_sensor
    address: 0x5A
    update_interval: 5s
    output_data_rate: 1HZ
  
  # Second sensor - Hallway (0x5B)
  # NOTE: Requires hardware modification to change sensor address
  # Configured for fast motion detection
  - id: hallway_sensor
    address: 0x5B
    update_interval: 500ms
    output_data_rate: 4HZ
    motion_lpf: ODR_DIV_9  # More sensitive

# Sensors
sensor:
  # Living room sensors
  - platform: sths34pf80
    sths34pf80_id: living_room_sensor
    ambient_temperature:
      name: "Living Room Temperature"
      id: living_room_temp
    presence:
      name: "Living Room Presence Value"
      id: living_room_presence_val
  
  # Hallway sensors
  - platform: sths34pf80
    sths34pf80_id: hallway_sensor
    ambient_temperature:
      name: "Hallway Temperature"
      id: hallway_temp
    motion:
      name: "Hallway Motion Value"
      id: hallway_motion_val

# Binary Sensors
binary_sensor:
  # Living room presence detection
  - platform: sths34pf80
    sths34pf80_id: living_room_sensor
    presence_flag:
      name: "Living Room Occupied"
      id: living_room_occupied
      on_press:
        then:
          - logger.log: "Living room occupied"
          - light.turn_on: living_room_light
      on_release:
        then:
          - logger.log: "Living room vacant"
          - delay: 5min
          - light.turn_off: living_room_light
  
  # Hallway motion detection (security)
  - platform: sths34pf80
    sths34pf80_id: hallway_sensor
    motion_flag:
      name: "Hallway Motion Detected"
      id: hallway_motion
      on_press:
        then:
          - logger.log: "Motion in hallway - possible intruder!"
          - homeassistant.event:
              event: esphome.security_motion
              data:
                location: hallway
                timestamp: !lambda 'return id(hallway_temp).state;'
          - light.turn_on: hallway_light
      on_release:
        then:
          - delay: 30s
          - light.turn_off: hallway_light

# Example lights (replace with your actual configuration)
light:
  - platform: binary
    name: "Living Room Light"
    id: living_room_light
    output: living_room_output
  
  - platform: binary
    name: "Hallway Light"
    id: hallway_light
    output: hallway_output

output:
  - platform: gpio
    pin: GPIO25
    id: living_room_output
  
  - platform: gpio
    pin: GPIO26
    id: hallway_output

# Template sensors for aggregate data
sensor:
  - platform: template
    name: "Average House Temperature"
    id: avg_temp
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 2
    lambda: |-
      if (id(living_room_temp).has_state() && id(hallway_temp).has_state()) {
        return (id(living_room_temp).state + id(hallway_temp).state) / 2.0;
      }
      return {};
    update_interval: 10s

# Template binary sensor for any occupancy
binary_sensor:
  - platform: template
    name: "House Occupied"
    id: house_occupied
    lambda: |-
      return id(living_room_occupied).state || id(hallway_motion).state;
    filters:
      - delayed_off: 5min

# Text sensor for overall house status
text_sensor:
  - platform: template
    name: "House Status"
    lambda: |-
      if (id(living_room_occupied).state && id(hallway_motion).state) {
        return {"Active - Multiple Rooms"};
      } else if (id(living_room_occupied).state) {
        return {"Living Room Occupied"};
      } else if (id(hallway_motion).state) {
        return {"Hallway Motion"};
      } else {
        return {"Vacant"};
      }
    update_interval: 1s

