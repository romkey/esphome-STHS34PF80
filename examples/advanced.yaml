# Example: every STHS34PF80 option, using the component directly instead of
# packages/sths34pf80.yaml. ESP32 DevKit.
#
# Wiring: VDD -> 3.3V, GND -> GND, SDA -> GPIO21, SCL -> GPIO22,
# INT -> GPIO4 (optional). None are strapping pins on the ESP32.

substitutions:
  name: sths34pf80-advanced
  friendly_name: STHS34PF80 Advanced

esp32:
  board: esp32dev
  framework:
    type: esp-idf

packages:
  base: !include common/base.yaml

external_components:
  - source: ../components
    components: [sths34pf80]

i2c:
  id: i2c0
  sda: GPIO21
  scl: GPIO22
  frequency: 400kHz

sths34pf80:
  - id: ir_sensor
    i2c_id: i2c0
    address: 0x5A
    update_interval: 500ms
    output_data_rate: 2HZ
    motion_lpf: ODR_DIV_9
    motion_presence_lpf: ODR_DIV_20
    presence_lpf: ODR_DIV_50
    temperature_lpf: ODR_DIV_100
    amb_temp_avg: 8
    obj_temp_avg: 32
    wide_gain_mode: false
    block_data_update: true
    # Drive the INT pin on presence or motion.
    enable_presence_interrupt: true
    enable_motion_interrupt: true
    int_active_low: false
    int_open_drain: false
    int_latched: false

sensor:
  - platform: sths34pf80
    sths34pf80_id: ir_sensor
    ambient_temperature:
      name: "Ambient Temperature"
      id: amb_temp
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 5
    object_temperature:
      name: "Object Temperature Raw"
      id: obj_temp
      entity_category: diagnostic
    compensated_object_temperature:
      name: "Object Temperature Compensated"
      id: obj_temp_comp
      entity_category: diagnostic
    presence:
      name: "Presence Value"
      id: presence_val
      entity_category: diagnostic
    motion:
      name: "Motion Value"
      id: motion_val
      entity_category: diagnostic
    temperature_shock:
      name: "Temperature Shock Value"
      id: temp_shock_val
      entity_category: diagnostic

binary_sensor:
  - platform: sths34pf80
    sths34pf80_id: ir_sensor
    presence_flag:
      name: "Presence"
      id: presence_flag
    motion_flag:
      name: "Motion"
      id: motion_flag
    temperature_shock_flag:
      name: "Temperature Shock"
      id: temp_shock_flag

  # The INT pin, to check the interrupt wiring.
  - platform: gpio
    pin: GPIO4
    name: "Interrupt Pin"
    entity_category: diagnostic

  # Occupied while presence or motion is seen, and for 30s afterwards.
  - platform: template
    name: "Occupied"
    device_class: occupancy
    lambda: |-
      return id(presence_flag).state || id(motion_flag).state;
    filters:
      - delayed_off: 30s
